name: gora_cabs
description: Gora Cabs - Taxi Requirement & Available Cab Network Platform
publish_to: 'none'
version: 1.0.7+23

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # HTTP & API
  dio: ^5.6.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

  # UI Components
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  pinput: ^5.0.0
  image_picker: ^1.1.2
  photo_view: ^0.15.0

  # Maps
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Payments
  razorpay_flutter: ^1.3.7

  # Dependency Injection & Functional
  get_it: ^7.7.0
  dartz: ^0.10.1

  # Utilities
  intl: ^0.20.2
  timeago: ^3.6.1
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.0
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  crypto: ^3.0.5

  # Chat / WebSocket
  socket_io_client: ^3.0.2

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^22.0.1
  flutter_overlay_window: ^0.5.0
  audioplayers: ^6.1.0
  android_play_install_referrer: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Gora_Taxi_Partner.png"
  min_sdk_android: 21
